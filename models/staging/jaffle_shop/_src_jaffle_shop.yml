sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 1111
          period: hour
        error_after:
          count: 100
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        config:
          freshness: null
      - name: orders

  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment